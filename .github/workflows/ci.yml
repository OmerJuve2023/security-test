name: Ci - yml
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Give Maven wrapper execute permission
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw -B clean verify